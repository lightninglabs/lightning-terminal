version: "2"

run:
  timeout: 10m
  build-tags:
    - autopilotrpc
    - signrpc
    - walletrpc
    - chainrpc
    - invoicesrpc
    - watchtowerrpc
    - neutrinorpc
    - peersrpc
    - dev

linters:
  default: standard
  enable:
    - ll
    - tagliatelle
    - whitespace
    - gosec
  settings:
    custom:
      ll:
        type: module
        description: "Custom lll linter with 'S' log line exclusion."
        settings:
          # Max line length, lines longer will be reported.
          line-length: 80
          # Tab width in spaces.
          tab-width: 8
          # Regex that detects the start of an `S` log line.
          log-regex: "^\\s*.*(L|l)og\\.(Info|Debug|Trace|Warn|Error|Critical)S\\("
    govet:
      # Do not report about shadowed variables.
      disable:
        - shadow
        - inline
    tagliatelle:
      case:
        rules:
          json: snake
    whitespace:
      multi-func: true
      multi-if: true
    gosec:
      excludes:
        - G402 # Look for bad TLS connection settings.
        - G306 # Poor file permissions used when writing to a new file.
        - G601 # Implicit memory aliasing in for loop.
        - G115 # Integer overflow in conversion.
    staticcheck:
      checks: ["S*"]

  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude gosec for tests that use weak randomness.
      - path: _test\.go
        linters:
          - gosec
      - path: internal/test/.*
        linters:
          - gosec
      # Fix false positives caused by build flags in itest.
      - path: itest/.*
        linters:
          - unused
          - deadcode
          - varcheck
      # Ignore line length for generated sqlc source.
      - path: db/sqlcmig6/.*
        linters:
          - lll
          - ll

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
