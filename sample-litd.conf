; Lightning Terminal (litd) sample configuration file.
;
; This file documents the configuration options for litd. Copy this file
; to your litd data directory and modify it to suit your needs.
;
; The default data directory is:
;   ~/.lit (Linux/macOS)
;   %LOCALAPPDATA%\Lit (Windows)

; Enable the built-in Lightning Terminal UI.
; httpslisten=0.0.0.0:8443

; Connect to an existing LND instance.
; lnd-mode=remote
; remote.lnd.rpcserver=localhost:10009
; remote.lnd.macaroonpath=~/.lnd/data/chain/bitcoin/mainnet/admin.macaroon
; remote.lnd.tlscertpath=~/.lnd/tls.cert

; Or run in integrated mode where litd manages its own LND instance.
; lnd-mode=integrated
; lnd.lnddir=~/.lnd

; Specify the network to use.
; network=mainnet

; Enable the Autopilot feature.
; autopilot.enable=true

; Enable Loop (submarine swaps).
; loop.enable=true

; Enable Pool (Lightning Liquidity).
; pool.enable=true

; Enable Faraday (revenue analysis).
; faraday.enable=true

; Enable Taproot Assets.
; taproot-assets.enable=true

; Set the UI password (required for first-time setup).
; uipassword=changeme

; Enable debug logging.
; debuglevel=info

; Set the log output file.
; logdir=~/.lit/logs
